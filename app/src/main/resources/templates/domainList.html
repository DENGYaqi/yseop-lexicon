<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
   <head>
      <meta charset="UTF-8" />
      <title>Domain List</title>
      <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}"/>
   </head>
   <body>
      <h2 align="center">Domain List</h2>
      <p align = "center"> <font size="2"><td th:text =${nbDomains}>...≤/td> <td> domains in Database.</font></td></p>
      <br/><br/>
      <div style="vertical-align:top; text-align: center; width : 100%; height : auto;">
         <table align = "center" border="1" cellpadding="3" cellspacing="0" style="width: 60%;margin:auto">
            <tr>
               <th>Id</th>
               <th>Value</th>
            </tr>
            <tr th:each ="d : ${domains}">
               <td th:utext="${d.id}">...</td>
               <td th:utext="${d.value}">...</td>
            </tr>
         </table>
        <br><br>
      </div>
    	<a href="/"> <p style="text-align:center">Home page</p></a>
   </body>
</html>
