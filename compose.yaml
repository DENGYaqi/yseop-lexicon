name: yseop-lexicon
services:
  db:
    image: public.ecr.aws/docker/library/mysql:5.7.42
    environment:
      MYSQL_DATABASE: lexicon
      MYSQL_USER: lexicon
      MYSQL_PASSWORD: ${LEXICON_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${LEXICON_ROOT_PASSWORD}
    volumes:
      - lexicon_db:/var/lib/mysql
      - ./data/current-lexicon.sql:/docker-entrypoint-initdb.d/01-current-lexicon.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 60
  app:
    build: ./app
    environment:
      LEXICON_DB_URL: jdbc:mysql://db:3306/lexicon?useTimezone=true&serverTimezone=UTC
      LEXICON_DB_USER: lexicon
      LEXICON_DB_PASSWORD: ${LEXICON_DB_PASSWORD}
    ports:
      - 127.0.0.1:18080:8080
    depends_on:
      db:
        condition: service_healthy
  smoke:
    profiles: [check]
    image: public.ecr.aws/docker/library/python:3.11.13-slim-bookworm
    environment:
      LEXICON_BASE_URL: http://app:8080
    volumes:
      - ./smoke_test.py:/smoke_test.py:ro
    command: ["python", "/smoke_test.py"]
    depends_on:
      - app
volumes:
  lexicon_db:
